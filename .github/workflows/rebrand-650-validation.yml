      - name: Strict NMP mate regressions (fresh process per FEN)
        shell: bash
        run: |
          set -euo pipefail
          cd src
          python3 -u - <<'PY' | tee ../nmp-validation.log
          import subprocess, threading, queue, re, time
          binary='./Revolution-6.50-271126-x86-64-universal'
          for fen,expected in [
              ('8/7p/7R/3p1N2/3P2pN/4p1P1/3pPppk/3Kbr2 b - - 0 1',-2),
              ('rk6/p1r3p1/P3B1Kp/1p2B3/8/8/8/8 w - - 0 1',5)
          ]:
              p=subprocess.Popen([binary],stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,bufsize=1)
              q=queue.Queue()
              def reader():
                  for line in p.stdout: q.put(line.strip())
                  q.put(None)
              threading.Thread(target=reader,daemon=True).start()
              def send(s):
                  p.stdin.write(s+'\n');p.stdin.flush()
              def wait(pattern,timeout=120):
                  end=time.monotonic()+timeout; lines=[]
                  while time.monotonic()<end:
                      l=q.get(timeout=max(0.1,end-time.monotonic()))
                      if l is None: raise RuntimeError('unexpected EOF')
                      print(l,flush=True);lines.append(l)
                      if re.search(pattern,l): return lines
                  raise RuntimeError('timeout')
              try:
                  send('uci');wait(r'^uciok$')
                  send('setoption name Threads value 1')
                  send('setoption name Hash value 64')
                  send('setoption name Experience Enabled value false')
                  send('ucinewgame');send('isready');wait(r'^readyok$')
                  send('position fen '+fen);send('go mate '+str(abs(expected)))
                  out=wait(r'^bestmove ',timeout=120)
                  mates=[int(m.group(1)) for l in out if (m:=re.search(r'score mate (-?\d+)',l))]
                  assert mates and mates[-1]==expected,(fen,mates,out[-1])
                  print('NMP_MATE_CASE=PASS '+str(expected))
                  send('quit');assert p.wait(timeout=20)==0
              finally:
                  if p.poll() is None: p.kill();p.wait()
          print('NMP_MATE_REGRESSIONS=PASS')
          PY
