name: P0A29 R28 isolated Universal validation
on:
  push:
    branches: [validation/p0a29-r28-universal-only]
permissions:
  contents: read
jobs:
  universal:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install signed LLVM 21 packages
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 60 https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor | sudo tee /usr/share/keyrings/llvm-r28.gpg >/dev/null
          printf '%s\n' 'deb [signed-by=/usr/share/keyrings/llvm-r28.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' | sudo tee /etc/apt/sources.list.d/llvm-r28.list
          sudo apt-get update
          sudo apt-get install -y clang-21 lld-21 llvm-21
          printf '%s\n' /usr/lib/llvm-21/bin >> "$GITHUB_PATH"
      - name: Verify the net and build exact Universal revisions
        id: universal_builds
        shell: bash
        run: bash .github/p0a29-r28-validation/build.sh
      - name: Run engine and fixture checks from network-free directories
        if: steps.universal_builds.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          binary=Revolution-6.40-150926-x86-64-universal
          stage="$RUNNER_TEMP/p0a29-r28-executables"
          bash .github/p0a29-r28-validation/run-runtime.sh "$stage/candidate/$binary" "$stage/r28/$binary" "$stage/p0a28/$binary" "$RUNNER_TEMP/p0a29-r28-evidence/runtime"
      - name: Retain gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0a29-r28-universal-evidence
          path: ${{ runner.temp }}/p0a29-r28-evidence/
          if-no-files-found: error
