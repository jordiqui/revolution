              def legacy(fen):
                  board,stm,rights,eps,*_=fen.split()
                  k=castle[sum(v for c,v in zip('KQkq',(1,2,4,8)) if c in rights)]
                  if stm=='b': k ^= side
                  if eps!='-': k ^= ep[ord(eps[0])-97]
                  for rank,row in enumerate(reversed(board.split('/'))):
